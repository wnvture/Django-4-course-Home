{% extends "base.html" %}
{% block content %}
    <div class="auth-layout">
        <div class="auth-copy">
            <div class="eyebrow">С ВОЗВРАЩЕНИЕМ</div>
            <h1>
                Ваш дом.
                <br>
                Ваш выбор.
            </h1>
            <p>Войдите, чтобы сохранить корзину и смотреть историю заказов.</p>
        </div>
        <section class="panel auth-panel">
            <h2>Вход в аккаунт</h2>
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                {% include "includes/form_fields.html" %}
                <button class="button full">Войти →</button>
            </form>
            <p class="auth-switch">Ещё нет аккаунта? <a href="{% url 'user:registration' %}">Зарегистрироваться</a>
            </p>
        </section>
    </div>
{% endblock %}
