{% extends "base.html" %}
{% block content %}
    <div class="auth-layout">
        <div class="auth-copy">
            <div class="eyebrow">РАДЫ ЗНАКОМСТВУ</div>
            <h1>
                Место для
                <br>
                ваших вещей.
            </h1>
            <p>Создайте аккаунт для учебных заказов. Используйте вымышленные контактные данные.</p>
        </div>
        <section class="panel auth-panel">
            <h2>Регистрация</h2>
            <form method="post">
                {% csrf_token %}
                {% include "includes/form_fields.html" %}
                <button class="button full">Создать аккаунт →</button>
            </form>
            <p class="auth-switch">Уже зарегистрированы? <a href="{% url 'user:login' %}">Войти</a>
            </p>
        </section>
    </div>
{% endblock %}
